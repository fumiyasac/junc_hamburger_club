name: webfront

on:
  push:
    branches: [main]
    paths:
      - 'junc_hamburger_club_webfront/**'
      - '.github/workflows/webfront.yml'
  pull_request:
    paths:
      # webfront 自身 + バックエンド変更時にも走らせる (API 変更で管理画面が壊れたことを E2E で検知)
      - 'junc_hamburger_club_webfront/**'
      - 'junc_hamburger_club_backend/**'
      - '.github/workflows/webfront.yml'

concurrency:
  group: webfront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junc_hamburger_club_webfront
    env:
      NEXT_PUBLIC_USER_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8080/api/v1/admin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: 'npm'
          cache-dependency-path: junc_hamburger_club_webfront/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint (next lint --dir src)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Next build
        run: npm run build

  e2e:
    needs: lint-typecheck-test-build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USER_API_URL: http://localhost:3100/api/v1
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8081/api/v1/admin
      E2E_BASE_URL: http://localhost:3002
      E2E_USER_API_URL: http://localhost:3100/api/v1
      E2E_ADMIN_API_URL: http://localhost:8081/api/v1/admin
      E2E_ADMIN_EMAIL: admin@junc-hamburger.com
      # ADMIN_PASSWORD_HASH が .env.example のデフォルト (admin1234) 前提
      E2E_ADMIN_PASSWORD_PLAIN: admin1234
    steps:
      - uses: actions/checkout@v7

      - name: Prepare backend .env
        working-directory: junc_hamburger_club_backend
        run: |
          cp .env.example .env
          # JWT_SECRET は 32 文字以上必須 (#66)
          echo "" >> .env
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> .env

      - name: Start backend (docker compose)
        working-directory: junc_hamburger_club_backend
        run: docker compose up -d --build

      - name: Wait for backend healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/health > /dev/null && curl -sf http://localhost:8081/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"
          docker compose -f junc_hamburger_club_backend/docker-compose.yml logs --tail=50
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          cache: 'npm'
          cache-dependency-path: junc_hamburger_club_webfront/package-lock.json

      - name: npm ci
        working-directory: junc_hamburger_club_webfront
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('junc_hamburger_club_webfront/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: junc_hamburger_club_webfront
        run: npx playwright install --with-deps chromium

      - name: Build webfront
        working-directory: junc_hamburger_club_webfront
        run: npm run build

      - name: Start Next.js (background)
        working-directory: junc_hamburger_club_webfront
        run: |
          nohup npm run start > ../next-start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/ > /dev/null; then
              echo "next ready"
              exit 0
            fi
            sleep 2
          done
          cat ../next-start.log
          exit 1

      - name: Playwright test
        working-directory: junc_hamburger_club_webfront
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            junc_hamburger_club_webfront/playwright-report
            junc_hamburger_club_webfront/test-results
          retention-days: 7

      - name: Dump backend logs (on failure)
        if: failure()
        working-directory: junc_hamburger_club_backend
        run: docker compose logs --tail=200
