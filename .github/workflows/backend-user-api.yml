name: backend-user-api

on:
  push:
    branches: [main]
    paths:
      - 'junc_hamburger_club_backend/user-api/**'
      - '.github/workflows/backend-user-api.yml'
  pull_request:
    paths:
      - 'junc_hamburger_club_backend/user-api/**'
      - '.github/workflows/backend-user-api.yml'

concurrency:
  group: backend-user-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junc_hamburger_club_backend/user-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          # NOTE: package-lock.json が未コミットのため npm cache は無効化している。
          # package-lock.json をコミットしたら `cache: 'npm'` と `cache-dependency-path` を有効化し、
          # 下の `npm install` を `npm ci` に差し替えること。

      - name: npm install
        run: npm install

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # NOTE: ESLint設定ファイル / ESLint本体パッケージ / ユニットテストが未整備のため、
      # lint・test ステップはスキップしている。整備は別タスクで対応予定。
