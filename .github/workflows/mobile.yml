name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'junc_hamburger_club_mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'junc_hamburger_club_mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junc_hamburger_club_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
