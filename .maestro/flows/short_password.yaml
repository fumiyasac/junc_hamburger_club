# バリデーション: 7 文字以下のパスワードで登録を試みるとクライアント側
# バリデーションで "8文字以上で入力してください" が表示されることを確認する。
appId: com.junc.juncHamburgerClub
name: short_password
---
- launchApp:
    clearState: true
    clearKeychain: true

- evalScript: ${output.name = 'テストユーザー'}
- evalScript: ${output.email = 'e2e-' + Date.now() + '@example.com'}
- evalScript: ${output.password = 'pass123'}      # 7 文字

- runFlow: ../subflows/onboarding_to_register.yaml
- runFlow: ../subflows/fill_register_form.yaml
- tapOn: "登録する 🎉"

- extendedWaitUntil:
    visible: "8文字以上で入力してください"
    timeout: 5000
- assertNotVisible: "🔥 人気バーガー"
