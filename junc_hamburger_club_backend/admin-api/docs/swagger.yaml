openapi: 3.0.3
info:
  title: JUNC Hamburger Club - Admin API
  description: |
    JUNC Hamburger Club の管理者向け REST API です。
    ダッシュボード、バーガー管理、注文管理、ユーザー管理を提供します。

    管理者認証には JWT Bearer トークンが必要です。
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1/admin
    description: Local development

tags:
  - name: Auth
    description: 管理者認証
  - name: Dashboard
    description: ダッシュボード統計
  - name: Burgers
    description: バーガー管理 (CRUD)
  - name: Orders
    description: 注文管理・ステータス更新
  - name: Users
    description: ユーザー管理
  - name: Pickup
    description: 受け取り枠 (pickup slot) の管理

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "admin@junc-hamburger.com"
        password:
          type: string
          example: "adminpassword"

    AdminLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                  example: "1"
                email:
                  type: string
                  format: email

    DashboardStats:
      type: object
      properties:
        totalOrders:
          type: integer
          example: 1234
        todayOrders:
          type: integer
          example: 42
        totalRevenue:
          type: number
          example: 1234567.00
        todayRevenue:
          type: number
          example: 45678.00
        activeOrders:
          type: integer
          example: 8
        totalUsers:
          type: integer
          example: 567
        totalBurgers:
          type: integer
          example: 20
        popularBurgers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer

    Burger:
      type: object
      properties:
        id:
          type: string
          example: "1"
        categoryId:
          type: string
          example: "1"
        name:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
        rating:
          type: number
        reviewCount:
          type: integer
        isPopular:
          type: boolean
        isAvailable:
          type: boolean
        calories:
          type: integer
          nullable: true
        ingredients:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    CreateBurgerRequest:
      type: object
      required: [categoryId, name, description, price]
      properties:
        categoryId:
          type: string
          example: "1"
        name:
          type: string
          example: "新作バーガー"
        description:
          type: string
        price:
          type: number
          example: 1200
        imageUrl:
          type: string
          nullable: true
        isPopular:
          type: boolean
          default: false
        calories:
          type: integer
          nullable: true
        ingredients:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    Order:
      type: object
      properties:
        id:
          type: string
          example: "1"
        userId:
          type: string
          example: "1"
        userName:
          type: string
        userEmail:
          type: string
        orderNumber:
          type: string
          example: "JUNC-20260525-0042"
        status:
          type: string
          enum: [received, preparing, ready, completed, cancelled]
        totalAmount:
          type: number
        taxAmount:
          type: number
        notes:
          type: string
          nullable: true
        estimatedReadyAt:
          type: string
          format: date-time
          nullable: true
        pickupAt:
          type: string
          format: date-time
          nullable: true
          description: 受け取り予定時刻 (JST, ISO 8601 with offset)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "1"
              burgerId:
                type: string
                example: "1"
              burgerName:
                type: string
              burgerImageUrl:
                type: string
                nullable: true
              quantity:
                type: integer
              unitPrice:
                type: number
              subtotal:
                type: number
              options:
                type: array
                description: 注文時点のオプションスナップショット (order_item_options)
                items:
                  $ref: '#/components/schemas/OrderItemOptionSnapshot'

    OptionGroup:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
        isRequired:
          type: boolean
        minSelect:
          type: integer
          minimum: 0
        maxSelect:
          type: integer
          minimum: 1
        displayOrder:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'

    Option:
      type: object
      properties:
        id:
          type: string
          example: "1"
        groupId:
          type: string
          example: "1"
        name:
          type: string
        priceDelta:
          type: number
          minimum: 0
        isAvailable:
          type: boolean
        displayOrder:
          type: integer

    OrderItemOptionSnapshot:
      type: object
      description: 注文確定時のオプション凍結データ。削除されたオプションは optionId が null になる
      properties:
        id:
          type: string
          example: "1"
        optionId:
          type: string
          nullable: true
          example: "3"
        groupName:
          type: string
          example: "パティ"
        optionName:
          type: string
          example: "ダブル"
        priceDelta:
          type: number

    User:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
        email:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PickupSettings:
      type: object
      properties:
        id:
          type: string
          example: "1"
        storeId:
          type: string
          example: "1"
        slotIntervalMin:
          type: integer
          example: 15
        slotCapacity:
          type: integer
          example: 4
        leadTimeMin:
          type: integer
          example: 20
        lookaheadDays:
          type: integer
          example: 3
        openTime:
          type: string
          example: "11:00:00"
        closeTime:
          type: string
          example: "21:00:00"
        closedWeekdays:
          type: string
          description: "CSV of 0..6 (0=Sunday). Empty string = no closed day"
          example: ""

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

paths:
  # ── Auth ─────────────────────────────────────────────────────────────
  /login:
    post:
      tags: [Auth]
      summary: 管理者ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Dashboard ─────────────────────────────────────────────────────────
  /dashboard:
    get:
      tags: [Dashboard]
      summary: ダッシュボード統計取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 統計データ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardStats'

  # ── Burgers ──────────────────────────────────────────────────────────
  /burgers:
    get:
      tags: [Burgers]
      summary: バーガー一覧 (管理)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: バーガー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      burgers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Burger'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    post:
      tags: [Burgers]
      summary: バーガー新規作成
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBurgerRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "21"

  /burgers/{id}:
    get:
      tags: [Burgers]
      summary: バーガー詳細
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: バーガー詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Burger'
    put:
      tags: [Burgers]
      summary: バーガー更新
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBurgerRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [Burgers]
      summary: バーガー削除
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功
        '404':
          description: バーガーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 既存の注文から参照されているため削除不可 (外部キー制約)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /burgers/{id}/availability:
    put:
      tags: [Burgers]
      summary: 販売可否の切り替え
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 切り替え成功

  # ── Orders ───────────────────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: 注文一覧 (管理)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [received, preparing, ready, completed, cancelled]
        - name: pickupDate
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: JST 暦日。この日の pickup_at を持つ注文のみ返す
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, pickup_at]
            default: created_at
          description: pickup_at 指定時は pickup_at ASC, created_at DESC 順
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 注文一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: 注文詳細
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 注文詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'

  /orders/{id}/status:
    put:
      tags: [Orders]
      summary: 注文ステータス更新
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [received, preparing, ready, completed, cancelled]
      responses:
        '200':
          description: 更新成功

  # ── Users ─────────────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: ユーザー一覧
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /users/{id}:
    get:
      tags: [Users]
      summary: ユーザー詳細
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ユーザー詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /users/{id}/toggle:
    put:
      tags: [Users]
      summary: ユーザーの有効/無効切り替え
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 切り替え成功

  # ── Pickup settings & slots ─────────────────────────────────────────
  /pickup-settings:
    get:
      tags: [Pickup]
      summary: 受け取り枠の設定取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 設定
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PickupSettings'
    put:
      tags: [Pickup]
      summary: 受け取り枠の設定更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupSettings'
      responses:
        '200':
          description: 更新成功
        '400':
          description: バリデーションエラー (slotIntervalMin<=0, openTime>=closeTime 等)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pickup-slots:
    get:
      tags: [Pickup]
      summary: 枠ごとの予約件数一覧 (管理画面タイムライン用)
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                      closed:
                        type: boolean
                      closedReason:
                        type: string
                        nullable: true
                      slots:
                        type: array
                        items:
                          type: object
                          properties:
                            startAt:
                              type: string
                              format: date-time
                            reservedCount:
                              type: integer
                            capacity:
                              type: integer

  /option-groups:
    get:
      tags: [Options]
      summary: オプショングループ一覧取得 (配下オプション含む)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OptionGroup'
    post:
      tags: [Options]
      summary: オプショングループ作成
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                isRequired:
                  type: boolean
                minSelect:
                  type: integer
                  minimum: 0
                maxSelect:
                  type: integer
                  minimum: 1
                displayOrder:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, example: "5" }
        '400':
          description: バリデーションエラー (min > max / maxSelect < 1 / isRequired=true && minSelect < 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /option-groups/{id}:
    put:
      tags: [Options]
      summary: オプショングループ更新
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isRequired:
                  type: boolean
                minSelect:
                  type: integer
                maxSelect:
                  type: integer
                displayOrder:
                  type: integer
      responses:
        '200':
          description: OK
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: グループが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /options:
    post:
      tags: [Options]
      summary: オプション作成
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, name]
              properties:
                groupId:
                  type: string
                name:
                  type: string
                priceDelta:
                  type: number
                  minimum: 0
                isAvailable:
                  type: boolean
                displayOrder:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, example: "14" }
        '400':
          description: バリデーションエラー (priceDelta < 0 など)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /options/{id}:
    put:
      tags: [Options]
      summary: オプション更新
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: string
                name:
                  type: string
                priceDelta:
                  type: number
                isAvailable:
                  type: boolean
                displayOrder:
                  type: integer
      responses:
        '200':
          description: OK
        '400':
          description: バリデーションエラー (priceDelta < 0 など)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: オプションが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /options/{id}/availability:
    put:
      tags: [Options]
      summary: オプションの売り切れトグル (is_available 反転)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: オプションが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /burgers/{id}/option-groups:
    get:
      tags: [Options]
      summary: バーガーに紐付くオプショングループ ID 一覧
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      groupIds:
                        type: array
                        items: { type: string }
    put:
      tags: [Options]
      summary: バーガーとオプショングループの紐付けをまるごと差し替え
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: OK
        '400':
          description: 非数値または存在しない groupId が含まれる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: バーガーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
