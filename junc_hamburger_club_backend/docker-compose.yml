version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: junc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-junc_hamburger}
      MYSQL_USER: ${MYSQL_USER:-junc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-junc_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-api:
    build:
      context: ./user-api
      dockerfile: ../Dockerfile.user-api
    container_name: junc_user_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-junc_hamburger}
      DB_USER: ${MYSQL_USER:-junc_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-junc_password}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtsecret}
    ports:
      - "3100:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./user-api/src:/app/src

  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    container_name: junc_admin_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-junc_hamburger}
      DB_USER: ${MYSQL_USER:-junc_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-junc_password}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtsecret}
      GIN_MODE: debug
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
