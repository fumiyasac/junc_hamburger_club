openapi: 3.0.3
info:
  title: JUNC Hamburger Club - User API
  description: |
    JUNC Hamburger Club のユーザー向け REST API です。
    認証、バーガー取得、カート管理、注文処理を提供します。
  version: 1.0.0
  contact:
    name: JUNC Dev Team
    email: dev@junc-hamburger.com

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: 認証 (登録・ログイン)
  - name: Burgers
    description: バーガー・カテゴリ情報
  - name: Cart
    description: カート管理
  - name: Orders
    description: 注文管理
  - name: Users
    description: ユーザープロフィール
  - name: News
    description: 店舗からのお知らせ (認証不要)
  - name: Pickup
    description: 受け取り枠 (pickup slot) の取得。認証不要
  - name: Public
    description: 公開情報 (店舗情報・アプリ設定)。認証不要

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "田中 太郎"
        email:
          type: string
          format: email
          example: "tanaka@example.com"
        profileImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [accessToken, refreshToken, accessTokenExpiresIn, refreshTokenExpiresIn, user]
          properties:
            accessToken:
              type: string
              description: 短命 JWT (15 分)。全認証 API に Bearer ヘッダで送る
              example: "eyJhbGciOiJIUzI1NiIs..."
            refreshToken:
              type: string
              description: 不透明ランダム文字列 (64 hex、30 日)。secure storage に保存し /auth/refresh に送る
              example: "a1b2c3d4...64hex"
            accessTokenExpiresIn:
              type: integer
              description: accessToken の残り有効秒数
              example: 900
            refreshTokenExpiresIn:
              type: integer
              description: refreshToken の残り有効秒数
              example: 2592000
            user:
              $ref: '#/components/schemas/User'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Category:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "クラシック"
        emoji:
          type: string
          example: "🍔"
        description:
          type: string
          nullable: true
        displayOrder:
          type: integer
          example: 1

    Burger:
      type: object
      properties:
        id:
          type: string
          example: "1"
        categoryId:
          type: string
          example: "1"
        categoryName:
          type: string
          example: "クラシック"
        categoryEmoji:
          type: string
          example: "🍔"
        name:
          type: string
          example: "JUNCクラシックバーガー"
        description:
          type: string
        price:
          type: number
          format: float
          example: 980
        imageUrl:
          type: string
          nullable: true
        rating:
          type: number
          format: float
          example: 4.5
        reviewCount:
          type: integer
          example: 234
        isPopular:
          type: boolean
          example: true
        isAvailable:
          type: boolean
          example: true
        calories:
          type: integer
          nullable: true
          example: 520
        ingredients:
          type: array
          items:
            type: string
          example: ["ビーフパティ (150g)", "ブリオッシュバンズ"]
        tags:
          type: array
          items:
            type: string
          example: ["定番", "人気"]
        optionGroups:
          type: array
          description: バーガー詳細 (GET /burgers/:id) のみに含まれる。一覧には含まれない。
          items: { $ref: '#/components/schemas/OptionGroup' }

    CartItem:
      type: object
      properties:
        id:
          type: string
        burgerId:
          type: string
        burgerName:
          type: string
        burgerPrice:
          type: number
          description: バーガー単体の基本価格 (option delta を含まない)
        burgerImageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
        options:
          type: array
          items: { $ref: '#/components/schemas/CartItemOption' }
        unitPrice:
          type: number
          description: burgerPrice + SUM(options.priceDelta)
        subtotal:
          type: number
          description: unitPrice * quantity

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          example: 2960
        tax:
          type: number
          example: 296
        total:
          type: number
          example: 3256

    OrderItem:
      type: object
      properties:
        id:
          type: string
        burgerId:
          type: string
        burgerName:
          type: string
        burgerImageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
        unitPrice:
          type: number
          description: オプション差分込みの単価
        subtotal:
          type: number
        options:
          type: array
          items: { $ref: '#/components/schemas/OrderItemOption' }

    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: "JUNC-20260525-0042"
        status:
          type: string
          enum: [received, preparing, ready, completed, cancelled]
          example: "received"
        totalAmount:
          type: number
          example: 3256
        taxAmount:
          type: number
          example: 296
        notes:
          type: string
          nullable: true
        estimatedReadyAt:
          type: string
          format: date-time
          nullable: true
        pickupAt:
          type: string
          format: date-time
          nullable: true
          description: 受け取り予定時刻 (JST, ISO 8601 with offset)。pickupAt 未指定で作成された注文では null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    Option:
      type: object
      required: [id, name, priceDelta, isAvailable, displayOrder]
      properties:
        id:          { type: string, example: "3" }
        name:        { type: string, example: "チェダーチーズ" }
        priceDelta:  { type: number, description: "基本価格からの差分 (>= 0)", example: 150 }
        isAvailable: { type: boolean }
        displayOrder:{ type: integer }

    OptionGroup:
      type: object
      required: [id, name, isRequired, minSelect, maxSelect, displayOrder, options]
      properties:
        id:           { type: string, example: "1" }
        name:         { type: string, example: "パティ" }
        isRequired:   { type: boolean }
        minSelect:    { type: integer }
        maxSelect:    { type: integer }
        displayOrder: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }

    CartItemOption:
      type: object
      required: [id, groupName, name, priceDelta]
      properties:
        id:         { type: string, description: "option_id" }
        groupName:  { type: string }
        name:       { type: string }
        priceDelta: { type: number }

    OrderItemOption:
      type: object
      required: [id, groupName, optionName, priceDelta]
      description: 注文時点のスナップショット。option が後で削除されても表示維持する。
      properties:
        id:         { type: string, description: "order_item_options.id" }
        optionId:   { type: string, nullable: true, description: "元 option の id (削除されると null)" }
        groupName:  { type: string }
        optionName: { type: string }
        priceDelta: { type: number }

    PickupSlot:
      type: object
      required: [startAt, available, remaining, reason]
      properties:
        startAt:
          type: string
          format: date-time
          description: 枠の開始時刻 (JST, ISO 8601 with offset)
        available:
          type: boolean
          description: この枠を選択できるか
        remaining:
          type: integer
          description: 残り受付可能件数 (capacity - reserved)
        reason:
          type: string
          nullable: true
          enum: [lead_time, out_of_hours, full, past, past_lookahead]
          description: 選択不可の理由コード。available=true の場合は null

    PickupSlotList:
      type: object
      required: [date, closed, slots]
      properties:
        date:
          type: string
          example: "2026-11-16"
        closed:
          type: boolean
          description: その日全体が利用不可の場合 true
        closedReason:
          type: string
          nullable: true
          enum: [closed_weekday, past, past_lookahead]
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PickupSlot'

    NewsCategory:
      type: string
      enum: [store, menu, campaign, app]
      description: |
        お知らせのカテゴリーコード値。クライアント側で日本語ラベルに変換して表示する。
        - `store`: 店舗情報 (営業時間変更、臨時休業など)
        - `menu`: 新メニュー・期間限定メニュー
        - `campaign`: キャンペーン・イベント
        - `app`: モバイルアプリに関するお知らせ

    NewsListItem:
      type: object
      description: 一覧用。本文は抜粋 (excerpt, 120 文字で切り詰め) のみを返す。
      required: [id, title, category, excerpt, publishedAt]
      properties:
        id:
          type: string
          example: "1"
        title:
          type: string
        category:
          $ref: '#/components/schemas/NewsCategory'
        excerpt:
          type: string
          description: 本文の冒頭を 120 文字で切り詰め、超過時は末尾に `…` を付与。改行は空白に畳む。
          example: "いつも JUNC Hamburger Club をご愛顧いただきありがとうございます。年末年始の営業時間を下記のとおりご案内いたします。..."
        publishedAt:
          type: string
          format: date-time

    News:
      type: object
      description: 詳細用。本文全文と各種タイムスタンプを含む。
      required: [id, title, category, body, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: "1"
        title:
          type: string
        category:
          $ref: '#/components/schemas/NewsCategory'
        body:
          type: string
          description: プレーンテキスト。改行は `\n` で表現。
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    # 統一エラーレスポンス形式。詳細は docs/error_codes.md 参照。
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: UPPER_SNAKE_CASE の機械判別用エラーコード
          example: PICKUP_SLOT_FULL
        message:
          type: string
          description: UI にそのまま表示できる日本語メッセージ
          example: この時間帯は予約がいっぱいです
        details:
          type: object
          description: UI 分岐に必要な情報 (code により構造が異なる)
          additionalProperties: true

    StoreProfile:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        openingHours:
          type: object
          description: 曜日ごとの営業時間。定休日は null。
          properties:
            mon: { $ref: '#/components/schemas/OpeningHour' }
            tue: { $ref: '#/components/schemas/OpeningHour' }
            wed: { $ref: '#/components/schemas/OpeningHour' }
            thu: { $ref: '#/components/schemas/OpeningHour' }
            fri: { $ref: '#/components/schemas/OpeningHour' }
            sat: { $ref: '#/components/schemas/OpeningHour' }
            sun: { $ref: '#/components/schemas/OpeningHour' }
        closedWeekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        todayStatus:
          type: string
          enum: [OPEN, OUTSIDE_HOURS, CLOSED_DAY]
    OpeningHour:
      nullable: true
      type: object
      properties:
        open: { type: string, example: "11:00" }
        close: { type: string, example: "21:00" }

    AppConfig:
      type: object
      properties:
        maintenance:
          type: object
          properties:
            enabled: { type: boolean }
            message: { type: string, nullable: true }
        ios:
          type: object
          properties:
            minVersion: { type: string, example: "1.0.0" }
            latestVersion: { type: string, example: "1.2.0" }
        android:
          type: object
          properties:
            minVersion: { type: string }
            latestVersion: { type: string }

    PreviewResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PreviewItem' }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        pickup:
          type: object
          properties:
            requestedAt: { type: string, nullable: true }
            available: { type: boolean }
            unavailableReason:
              type: string
              nullable: true
              enum: [PICKUP_INVALID_FORMAT, PICKUP_BOUNDARY, PICKUP_CLOSED_DAY, PICKUP_PAST_LOOKAHEAD, PICKUP_OUT_OF_HOURS, PICKUP_LEAD_TIME, PICKUP_SLOT_FULL]
            message: { type: string, nullable: true }
        canPlaceOrder: { type: boolean }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/PreviewWarning' }

    PreviewItem:
      type: object
      properties:
        cartItemId: { type: string }
        burgerId: { type: string }
        burgerName: { type: string }
        burgerImageUrl: { type: string, nullable: true }
        quantity: { type: integer }
        unitPrice: { type: number }
        subtotal: { type: number }
        options:
          type: array
          items: { $ref: '#/components/schemas/CartItemOption' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/PreviewWarning' }
    PreviewWarning:
      type: object
      properties:
        code: { type: string, enum: [BURGER_UNAVAILABLE, OPTION_OUT_OF_STOCK] }
        details:
          type: object
          additionalProperties: true

paths:
  # ── Auth ─────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "田中 太郎"
                email:
                  type: string
                  format: email
                  example: "tanaka@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "password123"
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: バリデーションエラー (name 空 / email 形式不正 / password 8 文字未満 等)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 認証失敗 (`USER_LOGIN_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: レートリミット超過 (`RATE_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: アクセストークンの再発行 (ローテーション)
      description: |
        既存の refreshToken を提示すると、新しい access+refresh のペアが返る。
        同じ refresh を 2 回使うと `TOKEN_REUSE_DETECTED` で同じ族 (端末) の全セッションが失効する。
        ネットワーク再送を救うため、ローテーション直後 90 秒間は前回の refresh も grace として受け付ける。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: ローテーション成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: refreshToken 未指定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            - `TOKEN_INVALID` — 存在しない / 失効済み
            - `TOKEN_EXPIRED` — 有効期限切れ
            - `TOKEN_REUSE_DETECTED` — 旧トークンの再利用。同端末の全セッションが失効
            - `USER_DEACTIVATED` — ユーザーが無効化されている
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: レートリミット超過
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 当該端末のリフレッシュトークンを失効
      description: Idempotent。既に失効済み / 存在しない refreshToken でも 200 を返す。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: OK

  # ── Burgers ──────────────────────────────────────────────────────────
  /burgers:
    get:
      tags: [Burgers]
      summary: バーガー一覧取得
      parameters:
        - name: category
          in: query
          schema:
            type: integer
          description: カテゴリIDでフィルタ
        - name: popular
          in: query
          schema:
            type: boolean
          description: 人気商品のみ
        - name: search
          in: query
          schema:
            type: string
          description: 名前・説明で検索
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      burgers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Burger'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /burgers/search:
    get:
      tags: [Burgers]
      summary: バーガー全文検索
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 検索キーワード
      responses:
        '200':
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Burger'

  /burgers/categories:
    get:
      tags: [Burgers]
      summary: カテゴリ一覧取得
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /burgers/{id}:
    get:
      tags: [Burgers]
      summary: バーガー詳細取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Burger'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Cart ─────────────────────────────────────────────────────────────
  /cart:
    get:
      tags: [Cart]
      summary: カート取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: カート内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Cart'
    post:
      tags: [Cart]
      summary: カートにアイテム追加
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [burgerId]
              properties:
                burgerId:
                  type: string
                  example: "1"
                quantity:
                  type: integer
                  default: 1
                  minimum: 1
                selectedOptionIds:
                  type: array
                  items: { type: string }
                  description: |
                    選択オプションの id 配列。重複は内部で一意化される。
                    同一 (burger, 選択組み合わせ) が既存なら quantity を加算、違う組み合わせは別行。
                  example: ["2", "3"]
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CartItem'
        '400':
          description: |
            オプションの検証エラー。`error.code` で原因判別:
              - `OPTION_NOT_FOUND` — 存在しない option id (details.optionId)
              - `OPTION_INVALID_BURGER` — このバーガーに適用されないグループのオプション (details.{optionId, optionName, groupId})
              - `OPTION_GROUP_REQUIRED` — 必須グループ未選択 (details.{groupId, groupName})
              - `OPTION_GROUP_MIN_VIOLATION` — 最小選択数未満
              - `OPTION_GROUP_MAX_VIOLATION` — 最大選択数超過
              - `OPTION_OUT_OF_STOCK` — 売り切れオプション (details.{optionId, optionName})
              - `BURGER_UNAVAILABLE` — 対象バーガーが販売停止 (details.burgerId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Cart]
      summary: カート全削除
      security:
        - BearerAuth: []
      responses:
        '200':
          description: クリア成功

  /cart/{itemId}:
    put:
      tags: [Cart]
      summary: カートアイテム数量更新
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [Cart]
      summary: カートからアイテム削除
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功

  # ── Orders ───────────────────────────────────────────────────────────
  /orders:
    post:
      tags: [Orders]
      summary: 注文作成 (カートから注文)
      description: |
        カートの内容から注文を作成する。
        pickupAt を指定すると受け取り枠を予約する。pickupAt は後方互換のため任意だが、
        新規クライアントでは必須指定を推奨 (将来必須化予定)。
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "ソース多めでお願いします"
                pickupAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                    受け取り予定時刻 (JST, ISO 8601 with offset)。
                    - 15 分刻みの境界に一致しない: 400 (code=pickup_boundary)
                    - 定休日: 400 (code=pickup_closed_day)
                    - lookahead 超過: 400 (code=pickup_past_lookahead)
                    - 営業時間外: 400 (code=pickup_out_of_hours)
                    - リードタイム内: 400 (code=pickup_lead_time)
                    - フォーマット不正: 400 (code=pickup_invalid_format)
                    - 枠が満杯: 409 (code=pickup_slot_full)
                  example: "2026-11-16T12:00:00+09:00"
      responses:
        '201':
          description: 注文成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: |
            `error.code` で詳細判別:
              - `CART_EMPTY` — カートが空
              - `PICKUP_INVALID_FORMAT` / `PICKUP_BOUNDARY` (details.slotIntervalMin) / `PICKUP_CLOSED_DAY` /
                `PICKUP_PAST_LOOKAHEAD` / `PICKUP_OUT_OF_HOURS` (details.{openTime,closeTime}) /
                `PICKUP_LEAD_TIME` (details.leadTimeMin) — pickupAt 検証失敗
              - `OPTION_OUT_OF_STOCK_AT_ORDER` (details.{itemId, optionId, optionName}) — 確定時にオプションが売り切れに
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            - `PICKUP_SLOT_FULL` (details.slotAt: ISO8601 JST) — 指定した受け取り枠が満杯
            - `ORDER_IDEMPOTENCY_IN_PROGRESS` (details.idempotencyKey) — 同じ `Idempotency-Key` で処理実行中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            - `ORDER_IDEMPOTENCY_CONFLICT` (details.idempotencyKey) — 同じキーで異なる body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Orders]
      summary: 注文履歴取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 注文一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 注文詳細・ステータス取得
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 注文詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: 見つからない

  /orders/{orderId}/cancel:
    put:
      tags: [Orders]
      summary: 注文キャンセル
      description: |
        注文状態が `received` のときのみキャンセル可能。
        それ以外 (`preparing` / `ready` / `completed` / `cancelled`) では 400 を返す。
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: キャンセル成功
        '400':
          description: キャンセル不可状態 (current status が received 以外)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 注文が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Users ─────────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: プロフィール取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: プロフィール
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: プロフィール更新
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                profileImageUrl:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 更新成功。更新後のプロフィールを返却
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Users]
      summary: アカウント削除
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 削除成功

  /users/me/password:
    put:
      tags: [Users]
      summary: パスワード変更
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 変更成功
        '400':
          description: バリデーションエラー (newPassword が 8 文字未満 等)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 現在のパスワードが違う

  # ── News ─────────────────────────────────────────────────────────────
  /news:
    get:
      tags: [News]
      summary: お知らせ一覧取得
      description: |
        公開日時 (`publishedAt`) の降順で返す。
        未来日時のお知らせ (予約公開) は含まれない。
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/NewsCategory'
          description: カテゴリーでフィルタ
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      news:
                        type: array
                        items:
                          $ref: '#/components/schemas/NewsListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          description: 無効な category 値
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /news/categories:
    get:
      tags: [News]
      summary: カテゴリーコード値一覧
      description: UI のタブ構築などに使う固定順の配列を返す。
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewsCategory'

  /news/{id}:
    get:
      tags: [News]
      summary: お知らせ詳細取得
      description: |
        指定 ID のお知らせを返す。
        未来日時 (予約公開) のお知らせは 404 を返す。
      parameters:
        - name: id
          in: path
          required: true
          description: お知らせ ID (数値文字列)。非数値は 400 を返す。
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/News'
        '404':
          description: 存在しない / 未公開
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Pickup slots (public) ────────────────────────────────────────────
  /pickup-slots:
    get:
      tags: [Pickup]
      summary: 受け取り枠一覧取得
      description: |
        指定日の受け取り枠一覧を返す。枠ごとに「選択可否」「残り受付可能数」「不可理由」を含む。
        認証不要。
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: JST の暦日 (YYYY-MM-DD)
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PickupSlotList'
        '400':
          description: date 未指定または形式エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /store:
    get:
      tags: [Public]
      summary: 店舗情報取得 (認証不要)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/StoreProfile' }
        '500':
          description: STORE_PROFILE_MISSING or APP_CONFIG_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /app-config:
    get:
      tags: [Public]
      summary: アプリ設定取得 (認証不要)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AppConfig' }
        '500':
          description: APP_CONFIG_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/preview:
    post:
      tags: [Orders]
      summary: 注文プレビュー (注文は作成しない)
      description: |
        カート明細 + 小計/税/合計、受け取り枠の可否、売り切れ・販売停止の警告を返す。
        warnings が空かつ pickup.available=true なら canPlaceOrder=true。
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/PreviewResponse' }
        '400':
          description: CART_EMPTY など。カートが空のみエラーで返る
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
